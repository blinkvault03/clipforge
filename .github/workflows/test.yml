name: ClipForge Automated Tests

on:
  push:
    branches:
      - main
      - v6.5-native-engine
  pull_request:
    branches:
      - main
      - v6.5-native-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run ClipForge Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg (for real export tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run automated tests
        run: npm test
